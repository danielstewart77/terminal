# Publish the terminal image on a tag.
#
# Consumers pin a version rather than following a branch, so this fires on
# `v*` tags and never on a push to main: a laptop install and the hive
# should be able to sit on different versions, and neither should move
# because main got a commit on a Saturday.

name: publish

on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # The tile's browser tests drive a real Chromium. Without this the
      # suite fails on a missing executable, which reads as a broken test
      # rather than a runner that was never provisioned.
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q

  publish:
    # Never ship a tag whose tests did not pass: the consumer pins this
    # digest and has no way to notice it was broken at build time.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Semver tags only, and explicitly no `latest`: a consumer that
          # tracks a moving tag has no version to roll back to.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=false

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
