<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hive Terminal</title>
    <link rel="icon" type="image/svg+xml" href="{{ request.url_for('static', path='favicon.svg') }}?v={{ asset_versions['favicon.svg'] }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ request.url_for('static', path='favicon-32.png') }}?v={{ asset_versions['favicon-32.png'] }}">
    <link rel="icon" type="image/png" sizes="192x192" href="{{ request.url_for('static', path='favicon-192.png') }}?v={{ asset_versions['favicon-192.png'] }}">
    <link rel="apple-touch-icon" href="{{ request.url_for('static', path='apple-touch-icon.png') }}?v={{ asset_versions['apple-touch-icon.png'] }}">
    <link rel="stylesheet" href="{{ request.url_for('static', path='style.css') }}?v={{ asset_versions['style.css'] }}">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code&display=swap" rel="stylesheet">
    <script>
    (function () {
        var nativeFetch = window.fetch.bind(window);
        var redirecting = false;
        window.fetch = function (input, init) {
            return nativeFetch(input, init).then(function (resp) {
                if (resp && resp.status === 401 && !redirecting) {
                    var path = window.location.pathname + window.location.search;
                    if (window.location.pathname !== "/login") {
                        redirecting = true;
                        window.location.assign("/login?next=" + encodeURIComponent(path));
                    }
                }
                return resp;
            });
        };
    })();
    </script>
</head>
<body>
    <nav>
        <div class="nav-inner">
            <span class="nav-brand-group">
                <a href="https://hive.sparktobloom.com" class="nav-brand glow">
                    <img src="{{ request.url_for('static', path='hive-icon.svg') }}?v={{ asset_versions['hive-icon.svg'] }}" alt="" class="nav-brand-icon">
                    hive
                </a>
                <span class="nav-brand-terminal glow">[terminal &gt;<span class="cursor-blink">&#9642;</span>]</span>
            </span>
            <button class="nav-toggle" aria-label="Toggle navigation" onclick="toggleNav()">&#9776;</button>
            <ul id="nav-links">
                <li class="user-controls">
                    {% if current_user %}
                    <div class="user-menu" data-user-menu>
                        <button
                            type="button"
                            class="user-menu-button"
                            aria-label="Open user menu"
                            aria-expanded="false"
                            aria-haspopup="true"
                            onclick="toggleUserMenu(event)"
                        >
                            <img
                                src="{{ request.url_for('static', path='images/cyborg_me.png') }}"
                                alt="{{ current_user.username }}"
                                class="user-avatar"
                            >
                        </button>
                        <div class="user-menu-panel">
                            <div class="user-menu-name">{{ current_user.username }}</div>
                            <form action="/logout" method="post" class="logout-form">
                                <button type="submit" class="user-menu-item">log out</button>
                            </form>
                        </div>
                    </div>
                    {% else %}
                    <a href="/login" class="login-icon-link" aria-label="Log in">log in</a>
                    {% endif %}
                </li>
            </ul>
        </div>
    </nav>
    <div class="content-wrapper">
        {% block content %}{% endblock %}
    </div>
    <script src="{{ request.url_for('static', path='scripts.js') }}?v={{ asset_versions['scripts.js'] }}"></script>
</body>
</html>
