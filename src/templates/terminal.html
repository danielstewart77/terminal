{% extends "layout.html" %}
{% block content %}
<link rel="stylesheet" href="{{ request.url_for('static', path='vendor/xterm/xterm.css') }}">
<main class="terminal-page">
    <div class="term-app" id="term-app" data-view="list" data-rail="expanded">
        <!-- ── Sessions list (the "agents" rail) ────────────────────── -->
        <section class="term-list-view" id="term-list-view">
            <header class="term-list-head">
                <button id="term-rail-collapse" class="term-icon-btn term-rail-btn" type="button"
                        title="collapse agents sidebar" aria-label="collapse agents sidebar">«</button>
                <h1 class="term-list-title">Agents</h1>
                <div class="term-seg" role="tablist" aria-label="session filter">
                    <button id="term-tab-active" class="term-seg-btn is-active" type="button"
                            role="tab" aria-selected="true" data-filter="active">Active</button>
                    <button id="term-tab-suspended" class="term-seg-btn" type="button"
                            role="tab" aria-selected="false" data-filter="suspended">Suspended</button>
                </div>
                <button id="term-new" class="term-action-btn" type="button" title="start a new session">+ new</button>
                <button id="term-refresh" class="term-action-btn" type="button" title="refresh session list">↻</button>
            </header>
            <div id="term-new-menu" class="term-new-menu" hidden aria-label="pick a mind"></div>
            <div id="term-list" class="term-list" aria-live="polite"></div>
            <p id="term-list-empty" class="term-list-empty" hidden>No sessions.</p>
        </section>

        <!-- ── Stage: the Brady-Bunch grid of attached terminals ────── -->
        <section class="term-stage" id="term-stage">
            <button id="term-rail-expand" class="term-rail-expand" type="button" hidden
                    title="show agents sidebar" aria-label="show agents sidebar">agents »</button>
            <div id="term-grid" class="term-grid" data-count="0"></div>
            <p id="term-grid-empty" class="term-grid-empty">Select a session from the list to open it here.</p>
        </section>
    </div>
    <div class="term-mobile-toolbar" id="term-mobile-toolbar" aria-label="terminal keys">
        <button type="button" data-seq="&#x1b;">Esc</button>
        <button type="button" data-seq="&#x09;">Tab</button>
        <button type="button" data-seq="&#x03;">Ctrl+C</button>
        <button type="button" data-scroll="-1" aria-label="scroll back a page">PgUp</button>
        <button type="button" data-scroll="1" aria-label="scroll forward a page">PgDn</button>
        <button type="button" data-seq="&#x1b;[D">&larr;</button>
        <button type="button" data-seq="&#x1b;[A">&uarr;</button>
        <button type="button" data-seq="&#x1b;[B">&darr;</button>
        <button type="button" data-seq="&#x1b;[C">&rarr;</button>
        <button type="button" data-seq="&#x0d;">&crarr;</button>
    </div>
</main>

<script src="{{ request.url_for('static', path='vendor/xterm/xterm.js') }}"></script>
<script src="{{ request.url_for('static', path='vendor/xterm/addon-fit.js') }}"></script>
<script src="{{ request.url_for('static', path='vendor/xterm/addon-webgl.js') }}"></script>
<script src="{{ request.url_for('static', path='terminal-routing.js') }}?v={{ asset_versions['terminal-routing.js'] }}"></script>
<script>
(function () {
    "use strict";

    // Interactive pty terminals (raw bytes over WS into `claude --resume`,
    // see src/backlog/web-terminal-interface.md) inside the session-manager
    // shell: agents rail, tile grid, per-session labels, TTS speaker. The
    // speaker rides the watch-only /api/console SSE stream — assistant text
    // is not recoverable from raw pty bytes.
    const termApp = document.getElementById("term-app");
    const listEl = document.getElementById("term-list");
    const listEmpty = document.getElementById("term-list-empty");
    const gridEl = document.getElementById("term-grid");
    const gridEmpty = document.getElementById("term-grid-empty");
    const refreshBtn = document.getElementById("term-refresh");
    const newBtn = document.getElementById("term-new");
    const newMenu = document.getElementById("term-new-menu");
    const tabActive = document.getElementById("term-tab-active");
    const tabSuspended = document.getElementById("term-tab-suspended");
    const railCollapseBtn = document.getElementById("term-rail-collapse");
    const railExpandBtn = document.getElementById("term-rail-expand");
    const toolbar = document.getElementById("term-mobile-toolbar");

    const REATTACH_WINDOW_MS = 30000;
    const isWide = () => window.matchMedia("(min-width: 860px)").matches;

    let currentFilter = "active";
    let lastRows = [];          // flat rows from /api/terminal/sessions
    const openPanels = new Map(); // sessionId -> panel
    let focusedPanel = null;

    const contrastText = TerminalRouting.contrastText;
    // only the focused tile paints its whole header bar; refresh both the
    // outgoing and incoming panel so the color follows focus, not just labels
    function setFocusedPanel(panel) {
        if (focusedPanel === panel) return;
        const prev = focusedPanel;
        focusedPanel = panel;
        if (prev && prev.refreshLabel) prev.refreshLabel();
        if (panel && panel.refreshLabel) panel.refreshLabel();
    }

    // ── open-set persistence (restore the grid across reloads) ─────
    // The URL fragment is the primary record — it survives a refresh in a
    // per-tab, shareable way and rides through the proxy untouched (see
    // TerminalRouting.parseOpenFragment). localStorage stays as a warm
    // cache and the pre-fragment migration source.
    function writeOpenFragment(ids) {
        const frag = TerminalRouting.formatOpenFragment(ids);
        const url = location.pathname + location.search + frag;
        try { history.replaceState(null, "", url); } catch (e) {}
    }
    function saveOpenSet() {
        const ids = Array.from(openPanels.keys());
        try { localStorage.setItem("term-open", JSON.stringify(ids)); } catch (e) {}
        writeOpenFragment(ids);
    }
    function recalledOpenSet() {
        // Fragment wins; fall back to the localStorage cache for a tab that
        // was opened before the fragment existed.
        const fromUrl = TerminalRouting.parseOpenFragment(location.hash);
        if (fromUrl.length) return fromUrl;
        try { return JSON.parse(localStorage.getItem("term-open") || "[]") || []; } catch (e) { return []; }
    }

    // ── per-session labels (custom name + color), server-backed ──────
    // Stored via /api/terminal/labels so names and colors follow the user
    // across devices; localStorage is only a warm-start cache (and the
    // migration source for labels created before the server store).
    const LABEL_COLORS = ["#4ee8fc", "#4ee88a", "#c9a84c", "#e0724e", "#b06ee0", "#e05c8a", "#7e93a8"];
    // further grid rows below the defaults: saturated / muted / grayscale
    const EXTRA_COLOR_ROWS = [
        ["#ff5c5c", "#ff8a3d", "#ffce42", "#c9e34e", "#5ce87a", "#3de0c0", "#3db6e8", "#5c8aff", "#9a5cff", "#e05cd0", "#ff5ca0"],
        ["#e0a8a8", "#e0c2a8", "#e0d8a8", "#c2e0a8", "#a8e0b8", "#a8d8e0", "#a8b8e0", "#c2a8e0", "#e0a8d8", "#e0a8b8", "#c9a8e0"],
        ["#ffffff", "#d8dee4", "#b0bcc6", "#8898a6", "#5c7284", "#3d5266", "#1e3448", "#0b1724"],
    ];
    let labelsCache = (function () {
        try { return JSON.parse(localStorage.getItem("term-labels") || "{}") || {}; } catch (e) { return {}; }
    })();
    function cacheLabelsLocally() {
        try { localStorage.setItem("term-labels", JSON.stringify(labelsCache)); } catch (e) {}
    }
    function pushLabel(id, label) {
        fetch("/api/terminal/labels/" + encodeURIComponent(id), {
            method: "PUT", credentials: "same-origin",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({name: label.name || "", color: label.color || ""}),
        }).catch(function () {});
    }
    // The server's copy is the record; this browser's is a warm-start cache
    // so the first paint is not unlabelled. Read on every poll, not once at
    // boot — a tab left open on one device has no other way to learn about a
    // name set on another, and a tab is left open for days.
    //
    // `no-store`, because the response carries no cache directive of its own
    // and a heuristically-cached one is indistinguishable from a current one:
    // a stale read used to look like the server had lost labels it still
    // held.
    async function syncLabelsFromServer() {
        let server = null;
        try {
            const resp = await fetch("/api/terminal/labels", {
                credentials: "same-origin", cache: "no-store",
            });
            if (resp.ok) server = await resp.json();
        } catch (e) {}
        if (!server || typeof server !== "object") return;
        // Nothing changed on the great majority of polls, and repainting
        // anyway rebuilds the whole rail twice a minute under whatever the
        // user is doing in it.
        const next = JSON.stringify(server);
        if (next === JSON.stringify(labelsCache)) return;
        // Replaced, not merged. Merging keeps a label this browser holds and
        // the server does not, which is exactly what a rename or a delete on
        // another device looks like from here.
        labelsCache = server;
        cacheLabelsLocally();
        renderCards(lastRows);
        openPanels.forEach(function (p) { p.refreshLabel(); });
    }
    function getLabel(id) {
        if (!id) return {};
        const l = labelsCache[id];
        return (l && typeof l === "object") ? l : {};
    }
    function setLabel(id, patch) {
        if (!id) return;
        const cur = (labelsCache[id] && typeof labelsCache[id] === "object") ? labelsCache[id] : {};
        const next = Object.assign({}, cur, patch);
        if (!next.name && !next.color) delete labelsCache[id]; else labelsCache[id] = next;
        cacheLabelsLocally();
        pushLabel(id, next);
    }
    // ── compose drafts ────────────────────────────────────────────
    // One key per session, not one JSON blob for all of them. The labels
    // cache reads its blob once at boot and writes the whole thing back, so
    // two tabs each holding their own copy overwrite each other's sessions;
    // for a name that is a nuisance, for a message the user is halfway
    // through typing it is their words gone. Per-key writes touch only the
    // session being typed into, and an ended session's draft is removed
    // rather than left to grow the blob forever.
    function draftKey(id) { return "term-draft:" + id; }
    function getDraft(id) {
        if (!id) return "";
        try { return localStorage.getItem(draftKey(id)) || ""; } catch (e) { return ""; }
    }
    function setDraft(id, text) {
        if (!id) return;
        try {
            if (text) localStorage.setItem(draftKey(id), text);
            else localStorage.removeItem(draftKey(id));
        } catch (e) {}
    }
    // Rotation replaces the conversation under a live tile. The unsent text
    // is the user's, not the conversation's — it follows, the way the label
    // and the open-set entry already do.
    function migrateDraft(oldId, newId) {
        if (!oldId || !newId || oldId === newId) return;
        const text = getDraft(oldId);
        setDraft(oldId, "");
        if (text) setDraft(newId, text);
    }

    // A draft outlives the tile that wrote it, on purpose — but only as long
    // as the session it was written to. A session ended from Telegram or the
    // CLI closes with no tile watching, so nothing would ever drop its key,
    // and every quota-bound write in this file shares one budget: once drafts
    // have filled it, labels and the open set silently stop persisting too.
    // The session list is the authority on what still exists.
    function pruneDrafts(rows) {
        const live = {};
        rows.forEach(function (r) { if (r && r.id) live[r.id] = true; });
        // Any open tile's session counts as live whatever the listing says —
        // a rotation's successor is written here before it appears there.
        openPanels.forEach(function (p, id) { live[id] = true; });
        let keys;
        try { keys = Object.keys(localStorage); } catch (e) { return; }
        keys.forEach(function (k) {
            if (k.indexOf("term-draft:") !== 0) return;
            if (live[k.slice("term-draft:".length)]) return;
            try { localStorage.removeItem(k); } catch (e) {}
        });
    }

    function migrateLabel(oldId, newId) {
        if (!oldId || !newId || oldId === newId) return;
        const label = labelsCache[oldId];
        if (!label) return;
        labelsCache[newId] = label;
        delete labelsCache[oldId];
        cacheLabelsLocally();
        pushLabel(newId, label);
        pushLabel(oldId, {});
    }

    // ── shared content helpers (assistant text out of console SSE) ──
    function flattenContent(v) {
        if (v == null) return "";
        if (typeof v === "string") return v;
        if (Array.isArray(v)) return v.map(flattenContent).join("");
        if (typeof v === "object") {
            if (typeof v.text === "string") return v.text;
            if (v.content != null) return flattenContent(v.content);
            return "";
        }
        return String(v);
    }
    function extractText(event) {
        const v = event.content || event.delta || event.text ||
            (event.message && (event.message.content || event.message.text)) || "";
        return flattenContent(v);
    }

    function wsUrl(sessionId, cols, rows) {
        const proto = location.protocol === "https:" ? "wss:" : "ws:";
        return proto + "//" + location.host + "/api/terminal/attach/" + encodeURIComponent(sessionId) +
            "?cols=" + encodeURIComponent(cols || 80) + "&rows=" + encodeURIComponent(rows || 24);
    }

    // ── one live session, rendered as an xterm tile ────────────────
    function createPanel(session) {
        let sessionId = session.id;
        let mindId = session.mind_id || null;
        let mindName = session.mind_name || null;
        let attachState = "connecting…";

        const el = document.createElement("section");
        el.className = "term-panel";
        el.dataset.sessionId = sessionId;
        el.innerHTML =
            '<header class="term-panel-head">' +
                '<button class="term-panel-back term-icon-btn" type="button" title="back to sessions" aria-label="back to sessions">‹</button>' +
                '<span class="term-panel-dot" hidden aria-hidden="true"></span>' +
                '<span class="term-panel-info">…</span>' +
                '<button class="term-panel-rename term-action-btn" type="button" title="rename / recolor this session" aria-label="rename this session">✎</button>' +
                '<button class="term-panel-mic term-action-btn" type="button" title="speak into this terminal" aria-label="voice input" aria-pressed="false">🎙</button>' +
                '<button class="term-panel-speaker term-action-btn" type="button" title="toggle voice playback" aria-pressed="false">speaker off</button>' +
                '<button class="term-panel-suspend term-action-btn term-action-btn-danger" type="button" ' +
                    'title="suspend this session and keep its conversation">suspend</button>' +
                '<button class="term-panel-close term-action-btn" type="button" title="remove from grid" aria-label="remove from grid">✕</button>' +
            '</header>' +
            '<div class="term-rename-pop" hidden>' +
                '<div class="term-rename-row">' +
                    '<input type="text" class="term-rename-input" maxlength="40" placeholder="session name" aria-label="session name">' +
                    '<div class="term-rename-actions">' +
                        '<button type="button" class="term-action-btn term-rename-clear">clear</button>' +
                        '<button type="button" class="term-action-btn term-rename-save">save</button>' +
                    '</div>' +
                '</div>' +
                '<div class="term-color-grid" role="group" aria-label="session color">' +
                    '<div class="term-color-grid-swatches"></div>' +
                    '<div class="term-color-grid-custom">' +
                        '<input type="color" class="term-color-input" aria-label="custom color">' +
                        '<span class="term-color-custom-label">custom</span>' +
                    '</div>' +
                '</div>' +
            '</div>' +
            '<div class="term-rotated" hidden>' +
                '<div class="term-rotated-head">' +
                    '<span class="term-rotated-title">This session rotated. Here is where it left off.</span>' +
                    '<button type="button" class="term-rotated-close term-icon-btn" title="dismiss" aria-label="dismiss">✕</button>' +
                '</div>' +
                '<div class="term-rotated-body"></div>' +
            '</div>' +
            '<div class="term-xterm"></div>' +
            // The compose box. A phone keyboard's autocorrect, prediction and
            // voice typing all work by rewriting text already in the field —
            // and xterm forwards that field to the pty keystroke by
            // keystroke, so every correction re-sends a region the pty
            // already has. That is the duplicated-sentence report. Here
            // nothing reaches the pty until the arrow, so there is no
            // already-sent region for the keyboard to rewrite.
            //
            // A real textarea, so the keyboard's own intelligence applies:
            // xterm's helper textarea carries autocorrect="off" and is
            // emptied after every burst, which is what makes suggestions
            // impossible in the pane itself.
            '<div class="term-compose" hidden>' +
                '<textarea class="term-compose-input" rows="2" maxlength="8000" ' +
                    'autocorrect="on" autocapitalize="sentences" spellcheck="true" ' +
                    'enterkeyhint="enter" ' +
                    'placeholder="message — return adds a line, arrow sends" ' +
                    'aria-label="compose a message"></textarea>' +
                '<button type="button" class="term-compose-send" title="send" aria-label="send">&#10148;</button>' +
            '</div>';

        const panelHead = el.querySelector(".term-panel-head");
        const headControls = Array.from(el.querySelectorAll(".term-panel-head button, .term-panel-head .term-panel-info"));
        const info = el.querySelector(".term-panel-info");
        const xtermEl = el.querySelector(".term-xterm");
        const micBtn = el.querySelector(".term-panel-mic");
        const speakerBtn = el.querySelector(".term-panel-speaker");
        const suspendBtn = el.querySelector(".term-panel-suspend");
        const closeBtn = el.querySelector(".term-panel-close");
        const backBtn = el.querySelector(".term-panel-back");
        const renameBtn = el.querySelector(".term-panel-rename");
        const renamePop = el.querySelector(".term-rename-pop");
        const renameInput = el.querySelector(".term-rename-input");
        const renameSave = el.querySelector(".term-rename-save");
        const renameClear = el.querySelector(".term-rename-clear");
        const headDot = el.querySelector(".term-panel-dot");
        const colorGridSwatches = el.querySelector(".term-color-grid-swatches");
        const colorInput = el.querySelector(".term-color-input");
        const composeEl = el.querySelector(".term-compose");
        const composeInput = el.querySelector(".term-compose-input");
        const composeSend = el.querySelector(".term-compose-send");
        const rotatedEl = el.querySelector(".term-rotated");
        const rotatedBody = el.querySelector(".term-rotated-body");
        const rotatedClose = el.querySelector(".term-rotated-close");

        const term = new window.Terminal({
            convertEol: true,
            cursorBlink: true,
            fontSize: 14,
            scrollback: 5000,
            theme: { background: "#080f18", foreground: "#dce8f0", cursor: "#c9a84c" },
        });
        const fitAddon = new window.FitAddon.FitAddon();
        term.loadAddon(fitAddon);

        // window's "resize" event alone misses layout changes that don't
        // resize the window itself -- a foldable unfolding, an on-screen
        // keyboard opening, or this tile's own container changing shape
        // when the rail collapses. Watch the tile's actual box instead.
        let fitRaf = null;
        function scheduleFit() {
            if (fitRaf) return;
            fitRaf = requestAnimationFrame(function () { fitRaf = null; doFit(); });
        }
        const resizeObserver = new ResizeObserver(scheduleFit);
        // The attach URL's cols/rows become the pty's spawn geometry, so the
        // measurement has to happen before the socket opens. A tile mounted
        // into a stage that hasn't been laid out yet — which on mobile is
        // every tile, since the rail is showing when you tap a card — has a
        // zero-sized box, FitAddon's proposeDimensions declines to guess,
        // and xterm silently keeps its 80x24 default. The TUI then paints
        // its first screen for a terminal nearly twice the width of the
        // phone showing it. Wait for a real box, then measure, then attach.
        function fitWhenSized(done, attempts) {
            const n = attempts || 0;
            if (xtermEl.clientWidth > 0 && xtermEl.clientHeight > 0) {
                try { fitAddon.fit(); } catch (e) {}
                done();
            } else if (n >= 60) {
                done();  // ~1s of frames; attach at the default rather than never
            } else {
                requestAnimationFrame(function () { fitWhenSized(done, n + 1); });
            }
        }
        // xterm paints only the rows it has marked dirty, so a repaint the
        // browser never performed is never retried: the buffer behind the
        // stale glyphs is already correct, and no later write touches those
        // rows again. That is the shape of the artifacts on this terminal —
        // garbage that survives indefinitely, and comes back correct the
        // moment a selection forces those rows to re-render. Every moment
        // where an invalidation is known to get dropped (a grid change, a
        // return from a backgrounded tab whose rAF was throttled, a tile
        // being clicked into) ends with the whole viewport repainted from
        // the buffer. refresh() walks the visible rows only, so it costs a
        // fraction of the fit that usually precedes it.
        let repaints = 0;
        function repaint() {
            repaints++;
            try { term.refresh(0, term.rows - 1); } catch (e) {}
        }
        // Text scrolling up is the moment an invalidation is most likely to
        // go missing, so every scroll ends in a repaint. Coalesced onto a
        // frame rather than fired per line: a build log scrolls hundreds of
        // lines a second and repainting each one would stall the tab, while
        // one repaint per frame is visually indistinguishable — the screen
        // cannot show more than a frame's worth of scrolling anyway.
        let repaintRaf = null;
        function scheduleRepaint() {
            if (repaintRaf) return;
            repaintRaf = requestAnimationFrame(function () {
                repaintRaf = null;
                repaint();
            });
        }
        // Scroll alone is not the trigger. onScroll fires when lines move
        // into scrollback, and the thing on the other end of this socket is
        // tmux — which lives in the alternate screen buffer, where nothing
        // ever scrolls into scrollback and a full-screen app simply redraws
        // in place. Hooking scroll only would leave the repaint dead for
        // every session anyone actually opens. New output is the real
        // signal, and onWriteParsed carries it for both buffers. It cannot
        // feed itself the way a render hook would: refresh() repaints, it
        // does not write.
        term.onScroll(scheduleRepaint);
        term.onWriteParsed(scheduleRepaint);

        // The renderer is the other half. xterm's default DOM renderer
        // paints the grid as a few thousand row divs and cell spans, and
        // the artifacts here are invalidations the browser drops somewhere
        // across that tree. WebGL collapses the whole grid into a single
        // canvas: one composited layer with no per-row elements to lose
        // track of, and no sub-cell slack outside a painted surface for the
        // stale strips either side of the grid to live in. It also costs
        // less under exactly the heavy scrolling that provokes the bug.
        // The addon attaches to a live screen, so this runs after open().
        let webgl = null;
        function loadRenderer() {
            if (!window.WebglAddon) return;
            try {
                const addon = new window.WebglAddon.WebglAddon();
                // A lost context leaves the canvas blank for good. Dropping
                // the addon returns xterm to its built-in DOM renderer —
                // slower and artifact-prone, but readable, and the paint
                // sweep that guards that renderer comes back with it.
                addon.onContextLoss(function () {
                    try { addon.dispose(); } catch (e) {}
                    webgl = null;
                    repaint();
                });
                term.loadAddon(addon);
                webgl = addon;
            } catch (e) {
                webgl = null;   // no WebGL here; the DOM renderer still works
            }
        }
        // What the terminal believes is on screen, straight out of the
        // buffer. Under WebGL there is no DOM to read a tile back from and
        // selecting the canvas gives you nothing, so this is how a garbled
        // tile gets read without touching it.
        function screenText() {
            const buf = term.buffer.active;
            const out = [];
            for (let y = 0; y < term.rows; y++) {
                const line = buf.getLine(buf.viewportY + y);
                out.push(line ? line.translateToString(true) : "");
            }
            return out.join("\n");
        }
        // Garbage on screen has exactly two possible homes, and they need
        // opposite fixes. Either xterm painted the wrong thing into the DOM,
        // or the DOM is right and the pixels under it are stale — a
        // compositor that dropped an invalidation, a remoting layer that
        // lost a tile. Reading the screen can't tell them apart, and
        // selecting the text destroys the evidence by forcing a repaint.
        // Comparing each painted row against the buffer it was rendered
        // from can: a row that disagrees is xterm's fault, and a screen full
        // of garbage over rows that all agree is not.
        // Only the DOM renderer has rows to compare; under WebGL there is
        // one canvas and nothing to read back, which is the point of it.
        function paintCheck() {
            const rows = xtermEl.querySelector(".xterm-rows");
            if (!rows) return null;
            const buf = term.buffer.active;
            const out = {rows: term.rows, drift: 0, samples: []};
            for (let y = 0; y < term.rows && y < rows.children.length; y++) {
                const line = buf.getLine(buf.viewportY + y);
                const want = (line ? line.translateToString(true) : "").replace(/\s+$/, "");
                const got = (rows.children[y].textContent || "").replace(/\s+$/, "");
                if (want !== got) {
                    out.drift++;
                    if (out.samples.length < 3) out.samples.push({row: y, buffer: want, dom: got});

        // ── pty attach over WS ────────────────────────────────────
        // Every handler comes off before the close, because close() is
        // asynchronous and a socket in CLOSING still delivers whatever the
        // browser has queued for it. Leaving onmessage attached let the
        // outgoing socket keep writing into the terminal alongside its
        // replacement — two tmux clients' cursor-addressed update streams
        // interleaved into one buffer, which is corruption no repaint can
        // undo. See TerminalRouting.detachSocket.
        function closeSocket() {

            ws = null;

        }
        // TEXT frames are the control channel (the pty end parses them as
        // JSON); terminal bytes always travel as BINARY frames.
        function sendResize() {

            }
        }

            closeSocket();

            socket.binaryType = "arraybuffer";
            socket.onopen = () => {
                socketOpenedAt = Date.now();

                setAttachState("attached");
                sendResize();

            socket.onmessage = (ev) => {
                lastRecvAt = Date.now();

                    const bytes = new Uint8Array(ev.data);
                    noteRealOutput(bytes);
                    term.write(bytes);
                    return;
                }

                // frame is the gateway's control channel, never output.
                // Never printed: echoing a control frame into the pane
                // corrupts the screen.
                let msg;

                if (ws === socket) ws = null;

                // Before anything else decides what to do with the tile: if a
                // submit went out and the pane never answered, those bytes
                // were written into a socket that was already gone.
                //
                // Except on 4412. That is rotation, and rotation is something
                // the conversation did in response to a turn — so the turn
                // landed, however quiet the pane was about it. Restoring there
                // would seed the successor with a message it has already had.
                if (!(ev && ev.code === 4412)) restorePendingSubmit();
                // 4410 = the gateway closed the session on purpose
                // (end-session, /kill). Don't hunt a successor — report
                // the ending and remove it from the terminal session lists.
                if (ev && ev.code === 4410) {
                    // The session is gone for good, so its stored draft can
                    // never be resumed — drop it rather than keep a key per
                    // dead conversation forever. What is on screen stays on
                    // screen, and stays selectable, for the user to copy out.
                    setDraft(sessionId, "");
                    setAttachState("session ended");
                    standDownMic();
                    refreshSessions();
                    return;
                }
                if (ev && ev.code === 4411) {
                    setAttachState("session suspended");
                    standDownMic();
                    refreshSessions();
                    return;
                }

                // took the keyboard. Reconnecting would start a tug-of-war,
                // so this tile stands down instead.

                    stopWith("open in another window");
                    return;
                }

                // image predates the terminal work). Retrying just spins,
                // so say what's wrong and stop.
                if (ev && ev.code === 4415) {
                    stopWith("no terminal on this mind");
                    return;
                }

                // conversation to resume, a harness with no pty). That is a
                // decision, not a blip: retrying just asks again forever.
                if (ev && ev.code === 1008) {
                    stopWith("mind refused the terminal");
                    return;
                }
                // 4412 = rotation retired this session for a successor and
                // the gateway already knows its id (carried in the close
                // reason) — reattach straight to it instead of polling
                // /api/terminal/sessions to rediscover what the close event
                // already told us.
                if (ev && ev.code === 4412 && ev.reason) {
                    attachSuccessor({id: ev.reason, mind_id: mindId, mind_name: mindName});
                    return;
                }

                // the successor session instead of sitting dead forever.

            };

            ws = socket;
        }
        // Reports whether the bytes actually went. A tile that has stood
        // down (evicted by another window, suspended, mid-reattach) looks
        // no different from a live one, so a caller that can't watch the
        // pane for an echo — the mic — needs to be told.
        function sendRaw(text) {

        // line": every change is diffed against the box's prior value, and
        // the difference is what goes to the pty. That works for a shell
        // xterm draws itself, but here a TUI (claude) owns the line, and the
        // box is never cleared between words. Left to accumulate, it holds
        // the whole line, and a mobile keyboard's autocorrect, prediction, or
        // multi-character backspace rewrites text the pty already has — the
        // diff then re-emits that stale region and the pty echoes it twice,
        // which is the "keys repeat, deleted characters come back" report.

        // it still holds what's being typed) makes each burst diff from an
        // empty base, so nothing already sent can be sent again.
        function resetImeAccumulator() {
            const helper = term._core && term._core._compositionHelper;
            if (helper && !TerminalRouting.shouldResetImeAccumulator({composing: helper._isComposing})) {
                return;
            }
            const ta = term.textarea;
            if (ta && ta.value) ta.value = "";
            if (helper) {

                if (pos) { pos.start = 0; pos.end = 0; }
            }
        }
        term.onData(resetImeAccumulator);

        // Scrolling by finger. On the alternate buffer — which is where
        // the TUI lives, and so the only buffer this tile ever really
        // shows — the viewport has no overflow, so the browser has
        // nothing to pan and a drag does nothing at all. Translate it
        // into the wheel reports the program turned on for itself.
        let dragY = null;

            if (e.touches.length !== 1 || !isAltBuffer()) { dragY = null; return; }

                col: Math.floor((t.clientX - box.left) / (box.width / term.cols)) + 1,
                row: Math.floor((t.clientY - box.top) / (box.height / term.rows)) + 1,

            dragY = t.clientY;
        }, {passive: true});

            if (dragY === null || e.touches.length !== 1) return;

            if (!move.steps) return;
            e.preventDefault();

            for (let i = 0; i < move.steps; i++) {

        xtermEl.addEventListener("touchcancel", function () { dragY = null; });

        // a bare return reaches the pty.
        //

        // time -- which is what the pty then echoed, the typed text

                composing: helper._isComposing,

        // garbage acts on it, so it is the cheapest place to hang the cure:

            // Accumulated, not replaced. Sending again is the natural response

            composeInput.value = "";
            // The stored draft deliberately survives the submit, and is

            scrollPage: function (dir) {

                // The return key belongs to whatever is being typed into. A

                closeTtsStream();
                stopTtsPlayback();
                abandonMicCapture();
                detachMicWidth();
                detachComposeMedia();
                try { term.dispose(); } catch (e) {}
                if (el.parentNode) el.parentNode.removeChild(el);
            },
        };
        return panel;
    }

    // ── grid / stage management ───────────────────────────────────
    function relayoutGrid() {
        // The key row belongs to an open tile, and opening or closing one is
        // the only thing that changes whether there is any.
        syncKeyRow();
        const n = openPanels.size;
        gridEl.dataset.count = String(n);
        gridEmpty.hidden = n > 0;
        if (n > 0) {
            const cols = Math.min(n, Math.ceil(Math.sqrt(n)));
            gridEl.style.gridTemplateColumns = "repeat(" + cols + ", minmax(0, 1fr))";
        } else {
            gridEl.style.gridTemplateColumns = "";
        }
        // Tile geometry changed for everyone — refit every terminal.
        requestAnimationFrame(function () {
            openPanels.forEach(function (p) { p.fit(); });
        });
    }

    function reKey(oldId, newId) {
        if (oldId === newId) return;
        const panel = openPanels.get(oldId);
        if (!panel) return;
        openPanels.delete(oldId);
        openPanels.set(newId, panel);
        saveOpenSet();
        renderCards(lastRows);
    }

    function closePanel(panel) {
        openPanels.delete(panel.sessionId);
        panel.destroy();
        if (focusedPanel === panel) focusedPanel = null;
        relayoutGrid();
        saveOpenSet();
        renderCards(lastRows);
        if (!isWide() && openPanels.size === 0) showView("list");
        if (openPanels.size === 0) releaseWakeLock();
    }

    function addPanel(session) {
        const existing = openPanels.get(session.id);
        if (existing) {
            existing.focus();
            if (!isWide()) showView("stage");
            return;
        }
        // mobile is single-panel: replace whatever's open
        if (!isWide()) {
            Array.from(openPanels.values()).forEach(function (p) { openPanels.delete(p.sessionId); p.destroy(); });
        }
        const panel = createPanel(session);
        openPanels.set(session.id, panel);
        gridEl.appendChild(panel.el);
        relayoutGrid();
        panel.mount();
        panel.focus();
        saveOpenSet();
        renderCards(lastRows);
        if (!isWide()) showView("stage");
        acquireWakeLock();
    }

    function showView(name) { termApp.dataset.view = name; syncKeyRow(); }

    // The key row and the compose box answer to the same question — is this a
    // device with an on-screen keyboard — and they used to answer it in
    // different places: the box in JS (narrow OR coarse pointer), the row in
    // a `max-width: 859px` media query. A phone in landscape is 915-932px, so
    // it got the box and no keys at all: no Esc, no Tab, no Ctrl+C, no arrows,
    // and no way to send a bare return to the pane. One gate, in JS, driving
    // both.
    const keyRowNarrow = window.matchMedia("(max-width: 859px)");
    const keyRowTouch = window.matchMedia("(hover: none) and (pointer: coarse)");
    function syncKeyRow() {
        const want = TerminalRouting.composeBoxWanted({
            narrow: keyRowNarrow.matches,
            coarsePointer: keyRowTouch.matches,
        }) && openPanels.size > 0 && (isWide() || termApp.dataset.view === "stage");
        toolbar.classList.toggle("is-on", want);
    }
    [keyRowNarrow, keyRowTouch].forEach(function (m) {
        if (m.addEventListener) m.addEventListener("change", syncKeyRow);
        else if (m.addListener) m.addListener(syncKeyRow);
    });

    // Each panel's own ResizeObserver (see createPanel) is the primary
    // refit trigger, but a foldable unfolding is reported (not reproduced
    // here in a headless Chromium run) to sometimes not resize a tile's
    // box at all on some mobile browsers even though the physical screen
    // -- and therefore the CSS viewport -- changed shape. visualViewport
    // and orientationchange are independent browser signals for exactly
    // that: a shape change that isn't a plain window resize. Redundant
    // with the observer in a well-behaved browser; the point is not
    // depending on any single one of the three firing.
    function refitAllPanels() {
        openPanels.forEach(function (p) { p.fit(); });
    }

    // The shell is exactly as tall as the part of the page you can see.
    //
    // A soft keyboard is drawn over the page. Where it is honoured,
    // `interactive-widget=resizes-content` makes it shorten the layout
    // viewport instead and 100dvh alone would be enough; iOS Safari
    // ignores the key entirely and shrinks only the visual viewport, so
    // the shell stayed full height with the keyboard parked over its
    // bottom third — over the prompt, the cursor, and the line being
    // typed. The only way to see what you were typing was to drag the
    // page up by hand. visualViewport.height is the one measurement that
    // is right on both, so it drives the height and 100dvh is the
    // fallback for browsers without it.
    //
    // iOS also *scrolls* the visual viewport rather than resizing the
    // layout one, which leaves the fixed nav pushed off the top; pinning
    // the window back to zero each time undoes that.
    function syncAppHeight() {
        const vv = window.visualViewport;
        if (!vv) return;
        document.documentElement.style.setProperty(
            "--app-h", Math.round(vv.height) + "px");
        if (window.scrollY !== 0) window.scrollTo(0, 0);
        refitAllPanels();
    }
    if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", syncAppHeight);
        window.visualViewport.addEventListener("scroll", syncAppHeight);
        syncAppHeight();
    }
    window.addEventListener("orientationchange", refitAllPanels);
    // Belt and suspenders: if none of the three signals above fire on a
    // given browser, this puts a hard ceiling of a couple seconds on how
    // long a tile can stay mis-sized rather than staying wrong forever.
    // fit() is cheap (a character-metric measurement plus an int compare)
    // and only sends a resize frame when the size actually changed.
    setInterval(refitAllPanels, 2000);

    // ── paint self-check ──────────────────────────────────────
    // window.paintCheck() reports, per open tile, how many painted rows
    // disagree with the buffer they came from. Loading the page with
    // ?paintcheck=1 runs it on a timer and writes the count into each
    // tile's header, so diagnosing a screen full of garbage needs no
    // devtools and no selecting — selecting is itself a repaint, and it
    // destroys the thing being measured.
    window.paintCheck = function () {
        const report = {};
        openPanels.forEach(function (p) { report[p.sessionId] = p.paintCheck(); });
        return report;
    };
    // window.rendererInfo() answers the first question about a garbled
    // tile — which renderer is actually behind it. A tile reporting
    // webgl:false has fallen back to the DOM renderer, and everything the
    // paint sweep below exists for applies again.
    window.screenText = function () {
        const report = {};
        openPanels.forEach(function (p) { report[p.sessionId] = p.screenText(); });
        return report;
    };
    window.rendererInfo = function () {
        const report = {};
        openPanels.forEach(function (p) { report[p.sessionId] = p.rendererInfo(); });
        return report;
    };
    // The sweep is the DOM renderer's safety net, and it reports nothing
    // for a tile on WebGL — there are no rows to read back, only a canvas.
    // Where it does apply, walking every painted row and reading the text
    // back out is the point: the read forces the browser to resolve rows it
    // has been treating as unchanged, which is exactly the invalidation
    // that goes missing while text scrolls. A fallen-back tile left alone
    // would otherwise accumulate stale strips indefinitely, since the
    // buffer behind them is already correct and nothing marks them dirty a
    // second time.
    //
    // If a row genuinely disagrees with its buffer the sweep repaints it,
    // but that is the rarer half. The flag only adds the readout.
    const SHOW_PAINT_CHECK = new URLSearchParams(location.search).has("paintcheck");
    setInterval(function () {
        openPanels.forEach(function (p) {
            const r = p.paintCheck();
            if (!r) return;
            if (r.drift) { p.repaint(); console.warn("paintcheck drift", r.samples); }
            if (SHOW_PAINT_CHECK) {
                const head = p.el.querySelector(".term-panel-info");
                if (head) head.textContent = "dom-drift " + r.drift + "/" + r.rows;
            }
        });
    }, 2000);

    // A rotation or an app-switch often kills the socket while the tab is
    // hidden, where the watchdog interval is throttled and can't fire. The
    // moment the tab comes back, check each tile eagerly so a returning
    // user gets a reattach in a beat instead of a 30s black screen while
    // the browser waits out its own dead-socket timeout.
    // A backgrounded tab has its requestAnimationFrame throttled to a
    // trickle or stopped outright, and xterm's render debouncer is built on
    // rAF: rows written while the tab was away can be marked dirty and
    // never painted, and nothing marks them dirty a second time. Repaint
    // every tile on the way back in, alongside the liveness check.
    function checkAllPanelsLive() {
        openPanels.forEach(function (p) { p.checkLiveness(); p.repaint(); });
    }
    document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") checkAllPanelsLive();
    });
    window.addEventListener("pageshow", checkAllPanelsLive);

    // ── screen wake lock ──────────────────────────────────────
    // The reattach machinery above exists to recover from a socket the OS
    // already killed. A mobile browser is far more likely to suspend the
    // tab -- and with it the socket -- while the screen is on but the tab
    // merely unfocused or the device about to auto-lock, than while the
    // page is actually asking to stay awake. Holding a wake lock while a
    // tile is open trades a bit of battery for fewer dead sockets to
    // recover from in the first place; it does nothing for a tab that's
    // genuinely backgrounded (the lock itself is released the moment
    // visibility is lost, same as the browser would anyway) or for a
    // desktop browser, where the API is absent and this is a no-op.
    let wakeLock = null;
    async function acquireWakeLock() {
        if (!("wakeLock" in navigator) || document.visibilityState !== "visible") return;
        if (openPanels.size === 0 || wakeLock) return;
        try {
            wakeLock = await navigator.wakeLock.request("screen");
            wakeLock.addEventListener("release", function () { wakeLock = null; });
        } catch (err) {
            // Denied (e.g. low battery mode) or unsupported at runtime --
            // the reattach loop is still there as the fallback.
        }
    }
    function releaseWakeLock() {
        if (wakeLock) wakeLock.release().catch(function () {});
    }
    document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") acquireWakeLock();
    });

    // ── session list rendering (flat rows grouped by mind) ────────
    function isActiveStatus(status) { return TerminalRouting.isActive({status: status}); }
    function statusDotClass(status) {
        const s = (status || "").toLowerCase();
        if (s === "running") return "is-running";
        if (s === "idle") return "is-idle";
        return "is-closed";
    }

    function renderCards(rows) {
        lastRows = rows || [];
        listEl.innerHTML = "";
        let count = 0;
        const byMind = new Map();
        lastRows.forEach(function (r) {
            const key = r.mind_id || r.mind_name || "?";
            if (!byMind.has(key)) byMind.set(key, {name: r.mind_name || key, rows: []});
            byMind.get(key).rows.push(r);
        });
        byMind.forEach(function (mind) {
            const sessions = mind.rows.filter(function (s) {
                return currentFilter === "active"
                    ? isActiveStatus(s.status)
                    : String(s.status || "").toLowerCase() === "suspended";
            });
            if (!sessions.length) return;
            const group = document.createElement("div");
            group.className = "term-mind-group";
            group.textContent = mind.name;
            listEl.appendChild(group);
            sessions.forEach(function (s) {
                const card = document.createElement("button");
                card.type = "button";
                card.className = "term-card" + (openPanels.has(s.id) ? " is-current" : "");

                // the list is where color shouts: paint the whole card and
                // flip the text to whichever pole stays readable on it
                const label = getLabel(s.id);
                if (label.color) {
                    card.classList.add("is-colored");
                    card.style.background = label.color;
                    card.style.borderColor = label.color;
                    card.style.color = contrastText(label.color);
                }

                const dot = document.createElement("span");
                dot.className = "term-card-dot " + statusDotClass(s.status);

                const body = document.createElement("span");
                body.className = "term-card-body";
                const title = document.createElement("span");
                title.className = "term-card-title";
                title.innerHTML = '<span class="term-card-name"></span> <span class="term-card-id"></span>';
                title.querySelector(".term-card-name").textContent = (label.name || "").trim() || s.mind_name || mind.name;
                title.querySelector(".term-card-id").textContent = s.short_id || (s.id || "").slice(0, 8);
                const meta = document.createElement("span");
                meta.className = "term-card-meta";
                meta.textContent = (s.status || "") + (s.age ? " · " + s.age : "");
                body.appendChild(title);
                body.appendChild(meta);
                if (s.summary) {
                    const sum = document.createElement("span");
                    sum.className = "term-card-summary";
                    sum.textContent = s.summary;
                    body.appendChild(sum);
                }
                card.appendChild(dot);
                card.appendChild(body);
                card.addEventListener("click", async function () {
                    let status = s.status || "running";
                    if (String(status).toLowerCase() === "suspended") {
                        card.disabled = true;
                        try {
                            const resp = await fetch(
                                "/api/terminal/sessions/" + encodeURIComponent(s.id) + "/resume",
                                {method: "POST", credentials: "same-origin"}
                            );
                            if (!resp.ok) {
                                card.disabled = false;
                                return;
                            }
                            const resumed = await resp.json();
                            status = resumed.status || "idle";
                        } catch (err) {
                            card.disabled = false;
                            return;
                        }
                    }
                    addPanel({
                        id: s.id,
                        mind_id: s.mind_id,
                        mind_name: s.mind_name,
                        status: status,
                    });
                    await refreshSessions();
                });
                listEl.appendChild(card);
                count += 1;
            });
        });
        listEmpty.hidden = count > 0;
        listEmpty.textContent = currentFilter === "active" ? "No active sessions." : "No suspended sessions.";
    }

    async function refreshSessions() {
        try {
            const resp = await fetch("/api/terminal/sessions", {credentials: "same-origin"});
            if (!resp.ok) return [];
            const rows = await resp.json();
            renderCards(Array.isArray(rows) ? rows : []);
            pruneDrafts(Array.isArray(rows) ? rows : []);
            return lastRows;
        } catch (err) {
            return [];
        }
    }

    // ── new session ───────────────────────────────────────────────
    async function spawnSession(mind) {
        newMenu.hidden = true;
        try {
            const resp = await fetch("/api/terminal/sessions", {
                method: "POST", credentials: "same-origin",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({mind_id: mind.id}),
            });
            if (!resp.ok) return;
            const sess = await resp.json();
            addPanel({
                id: sess.id,
                mind_id: sess.mind_id || mind.id,
                mind_name: mind.name,
                status: sess.status || "running",
            });
            await refreshSessions();
        } catch (err) {}
    }
    async function toggleNewMenu() {
        if (!newMenu.hidden) { newMenu.hidden = true; return; }
        newMenu.hidden = false;
        newMenu.textContent = "loading minds…";
        let minds = [];
        try {
            const resp = await fetch("/api/minds", {credentials: "same-origin"});
            if (resp.ok) minds = await resp.json();
        } catch (err) {}
        minds = (Array.isArray(minds) ? minds : []).filter(function (m) { return m && m.id; });
        newMenu.innerHTML = "";
        if (!minds.length) { newMenu.textContent = "no minds registered"; return; }
        if (minds.length === 1) { spawnSession(minds[0]); return; }
        minds.forEach(function (m) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "term-new-menu-item";
            btn.textContent = "new · " + (m.name || m.id);
            btn.addEventListener("click", function () { spawnSession(m); });
            newMenu.appendChild(btn);
        });
    }
    newBtn.addEventListener("click", toggleNewMenu);
    document.addEventListener("click", function (e) {
        if (!newMenu.hidden && !newMenu.contains(e.target) && e.target !== newBtn) newMenu.hidden = true;
    });

    // ── filter tabs ───────────────────────────────────────────────
    function setFilter(filter) {
        currentFilter = filter;
        const activeSel = filter === "active";
        tabActive.classList.toggle("is-active", activeSel);
        tabSuspended.classList.toggle("is-active", !activeSel);
        tabActive.setAttribute("aria-selected", activeSel ? "true" : "false");
        tabSuspended.setAttribute("aria-selected", activeSel ? "false" : "true");
        renderCards(lastRows);
    }
    tabActive.addEventListener("click", function () { setFilter("active"); });
    tabSuspended.addEventListener("click", function () { setFilter("suspended"); });
    refreshBtn.addEventListener("click", function () { refreshSessions(); });

    // ── rail collapse (desktop) ───────────────────────────────────
    function setRail(collapsed) {
        termApp.dataset.rail = collapsed ? "collapsed" : "expanded";
        railExpandBtn.hidden = !collapsed;
        try { localStorage.setItem("term-rail", collapsed ? "collapsed" : "expanded"); } catch (e) {}
        openPanels.forEach(function (p) { p.fit(); });
    }
    railCollapseBtn.addEventListener("click", function () { setRail(true); });
    railExpandBtn.addEventListener("click", function () { setRail(false); });

    // ── mobile key toolbar (routes to the focused tile) ───────────
    // A key-row tap must not take the keyboard away from the compose box.
    // Focus moves on mousedown, so the button stealing it closes the soft
    // keyboard mid-sentence — and Ctrl+C, the one key someone reaches for
    // while composing a follow-up to a running turn, is exactly when that
    // happens.
    toolbar.addEventListener("mousedown", function (ev) {
        if (ev.target.closest("button")) ev.preventDefault();
    });
    toolbar.addEventListener("click", function (ev) {
        const btn = ev.target.closest("button[data-seq], button[data-scroll]");
        if (!btn) return;
        const target = focusedPanel || openPanels.values().next().value;
        if (!target) return;
        // A phone has no visible scrollbar and no PageUp key, so a reply
        // taller than the screen had nothing to reach the rest of it with.
        // Where that scrolling happens depends on which buffer is up —
        // see TerminalRouting.pageScrollAction — so the panel decides.
        if (btn.dataset.scroll) {
            target.scrollPage(Number(btn.dataset.scroll));
            return;
        }
        target.sendBytes(btn.dataset.seq);
    });

    // ── boot ──────────────────────────────────────────────────────
    try {
        if (localStorage.getItem("term-rail") === "collapsed" && isWide()) setRail(true);
    } catch (e) {}

    showView("list");
    syncLabelsFromServer();
    // Labels are edited on whichever device is to hand, and a tile is left
    // open for days — so this tab has to keep asking. On becoming visible
    // too: a phone that was in a pocket during the edit polls nothing, and
    // coming back to a stale name is exactly the case this exists for.
    setInterval(syncLabelsFromServer, 30000);
    document.addEventListener("visibilitychange", function () {
        if (document.visibilityState === "visible") syncLabelsFromServer();
    });
    refreshSessions().then(function (rows) {
        const active = (rows || []).filter(function (r) { return isActiveStatus(r.status); });
        const byId = {};
        active.forEach(function (r) { byId[r.id] = r; });
        const wanted = recalledOpenSet().map(function (id) { return byId[id]; }).filter(Boolean);
        // Mobile is single-panel: a refresh restores the one session the
        // fragment names rather than dumping the user back on the list. No
        // named session (or it went inactive) leaves the list showing.
        if (!isWide()) {
            if (wanted.length) {
                const hit = wanted[0];
                addPanel({id: hit.id, mind_id: hit.mind_id, mind_name: hit.mind_name, status: hit.status});
            }
            return;
        }
        // Desktop: reopen the whole recalled grid, or fall back to the most
        // recent active session so the stage isn't empty on a first visit.
        wanted.forEach(function (hit) {
            addPanel({id: hit.id, mind_id: hit.mind_id, mind_name: hit.mind_name, status: hit.status});
        });
        if (wanted.length === 0 && active.length > 0) {
            const first = active[0];
            addPanel({id: first.id, mind_id: first.mind_id, mind_name: first.mind_name, status: first.status});
        }
    });
})();
</script>
